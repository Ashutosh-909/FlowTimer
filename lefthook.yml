# Git hooks. Installed by `make setup` (needs lefthook: brew install lefthook / npm i -g lefthook).
pre-commit:
  parallel: true
  commands:
    ktlint:
      glob: "*.{kt,kts}"
      run: sh ./gradlew --quiet ktlintCheck

commit-msg:
  commands:
    conventional-commit:
      run: >-
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
        || { echo "Commit message must be a conventional commit, e.g. 'feat(home): add streak card'"; exit 1; }

pre-push:
  commands:
    verify:
      run: make verify
