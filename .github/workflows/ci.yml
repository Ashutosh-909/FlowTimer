# Inline CI: this repo is public and owned by another account, so it cannot call the private
# nextjedi/platform reusable workflows. Same contract: run `make verify`.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: make verify
        run: make verify
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-android
          if-no-files-found: ignore
          path: |
            **/build/test-results/
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/reports/kover/
            **/build/reports/detekt/
